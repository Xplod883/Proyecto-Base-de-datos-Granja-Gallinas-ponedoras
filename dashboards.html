<script>

function limpiarBotones(){

    document
    .querySelectorAll('.dash-btn')
    .forEach(btn=>{
        btn.classList.remove('active');
    });

}

function cargarDashboard(ruta,titulo,boton){

    limpiarBotones();

    boton.classList.add('active');

    document.getElementById(
        'dashboard-title'
    ).textContent=titulo;

    document.getElementById(
        'dashboard-frame'
    ).src=ruta;

}

function cargarPowerBIDashboard(url,titulo,boton){

    limpiarBotones();

    boton.classList.add('active');

    document.getElementById(
        'dashboard-title'
    ).textContent=titulo;

    document.getElementById(
        'dashboard-frame'
    ).src=url;

}

function dashboardPendiente(boton){

    limpiarBotones();

    boton.classList.add('active');

    document.getElementById(
        'dashboard-title'
    ).textContent='Dashboard D3JS #3 Pendiente';

    document.getElementById(
        'dashboard-frame'
    ).src='about:blank';

}

</script>
